name: Xcode Cloud Results

# The Xcode Cloud nightly (which also produces the TestFlight build) runs the
# unit tests and the render regression on macOS and sends the results here as a
# repository_dispatch event (ci_scripts/xcode_cloud_tests.sh). This adds them to
# the dashboard history and republishes the page. A payload with "dry_run": true
# builds the page and uploads it as an artifact without publishing. A manual run
# with drop_run takes the history entry made by an earlier run of this workflow
# (a bad result) out of the dashboard.
on:
  repository_dispatch:
    types: [xcode-cloud-results]
  workflow_dispatch:
    inputs:
      drop_run:
        description: Run id of a run of this workflow whose dashboard entry should be removed
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy-retry.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
    - uses: actions/checkout@v4

    - name: Build the dashboard
      env:
        RESULTS: ${{ toJson(github.event.client_payload.results) }}
        BUILD_NUMBER: ${{ github.event.client_payload.build_number }}
        EVENT: ${{ github.event_name }}
        DROP_RUN: ${{ github.event.inputs.drop_run }}
      run: |
        RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        # A cache-busting query keeps a CDN-cached history.json from dropping an entry made minutes ago.
        curl -fsSL "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/history.json?t=$(date +%s)" \
          -H 'Cache-Control: no-cache' -o history.json || echo "no published history yet"
        # A deploy replaces the whole site: keep the coverage report the nightly published.
        sh ci_scripts/stage_coverage.sh site "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
        if [ "$EVENT" = "workflow_dispatch" ]; then
          python3 ci_scripts/build_dashboard.py unused site history.json "$RUN_URL" --no-entry --drop-run "$DROP_RUN"
        else
          printf '%s' "$RESULTS" > nightly-results.json
          python3 -c "import json; d = json.load(open('nightly-results.json')); assert d['suites'], 'no suites in the payload'"
          python3 ci_scripts/build_dashboard.py nightly-results.json site history.json "$RUN_URL"
        fi

    # The artifact is named per attempt: "Re-run failed jobs" uploads another
    # one into the same run, and deploy-pages refuses a run holding two
    # artifacts of one name.
    - name: Upload the site
      if: ${{ github.event.client_payload.dry_run != true }}
      uses: actions/upload-pages-artifact@v5
      with:
        path: site
        name: github-pages-${{ github.run_attempt }}

    # The Pages API answers with the odd 5xx (sometimes after the site has
    # already gone live); one more try a minute later rides that out, and
    # deploying the same site twice is harmless.
    - name: Deploy
      if: ${{ github.event.client_payload.dry_run != true }}
      id: deploy
      continue-on-error: true
      uses: actions/deploy-pages@v5
      with:
        artifact_name: github-pages-${{ github.run_attempt }}

    - name: Wait before retrying the deploy
      if: ${{ github.event.client_payload.dry_run != true && steps.deploy.outcome == 'failure' }}
      run: sleep 60

    - name: Deploy (retry)
      if: ${{ github.event.client_payload.dry_run != true && steps.deploy.outcome == 'failure' }}
      id: deploy-retry
      uses: actions/deploy-pages@v5
      with:
        artifact_name: github-pages-${{ github.run_attempt }}

    - name: Keep the dry-run page for inspection
      if: ${{ github.event.client_payload.dry_run == true }}
      uses: actions/upload-artifact@v4
      with:
        name: dry-run-site
        path: site
        retention-days: 3
